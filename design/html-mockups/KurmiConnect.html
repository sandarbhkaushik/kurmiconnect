<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KurmiConnect — 76-screen library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600&family=Inter:wght@400;500;600&family=Mukta+Vaani:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: "Mukta", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screens-1-20.jsx"></script>
<script type="text/babel" src="screens-21-36.jsx"></script>
<script type="text/babel" src="screens-37-52.jsx"></script>
<script type="text/babel" src="admin-screens.jsx"></script>
<script type="text/babel" src="prototype.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "midnight"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = KC_PALETTES[t.palette] || KC_PALETTES.saffron;

  // Lay out the screen library.
  // userScreens / adminScreens are arrays of [id, label, Component] tuples.
  const preauth = [
    ['s01', '01 · Splash', S01_Splash],
    ['s02', '02 · Language picker', S02_Language],
    ['s03', '03 · Phone entry', S03_Phone],
    ['s04', '04 · OTP verification', S04_OTP],
  ];
  const onboarding = [
    ['s05', '05 · Profile for whom', S05_ProfileFor],
    ['s06', '06 · Basic info', S06_Basic],
    ['s07', '07 · Physical', S07_Physical],
    ['s08', '08 · Community & caste', S08_Community],
    ['s09', '09 · Current location', S09_Location],
    ['s10', '10 · Native place', S10_Native],
    ['s11', '11 · Education', S11_Education],
    ['s12', '12 · Profession', S12_Profession],
    ['s13', '13 · Lifestyle', S13_Lifestyle],
    ['s14', '14 · Family details', S14_Family],
    ['s15', '15 · Horoscope', S15_Horoscope],
    ['s16', '16 · About me', S16_About],
    ['s17', '17 · Photo upload', S17_Photos],
    ['s18', '18 · Partner prefs · basic', S18_PrefsBasic],
    ['s19', '19 · Partner prefs · community', S19_PrefsCommunity],
    ['s20', '20 · Partner prefs · career', S20_PrefsCareer],
  ];
  const discovery = [
    ['s21', '21 · Home / today\'s matches', S21_Home],
    ['s22', '22 · Featured Personalities', S22_Featured],
    ['s23', '23 · Featured category browser', S23_FeaturedCategory],
    ['s24', '24 · Featured profile detail', S24_FeaturedDetail],
    ['s25', '25 · Search entry', S25_Search],
    ['s26', '26 · Advanced filters', S26_Filters],
    ['s27', '27 · Search results', S27_SearchResults],
    ['s28', '28 · Profile detail', S28_ProfileDetail],
    ['s29', '29 · Photo gallery', S29_Gallery],
  ];
  const interactions = [
    ['s30', '30 · Send interest', S30_SendInterest],
    ['s31', '31 · Interests sent', S31_InterestsSent],
    ['s32', '32 · Interests received', S32_InterestsReceived],
    ['s33', '33 · Accepted matches', S33_Accepted],
    ['s34', '34 · Shortlist', S34_Shortlist],
    ['s35', '35 · Chat list', S35_ChatList],
    ['s36', '36 · Chat conversation', S36_Chat],
  ];
  const subscription = [
    ['s37', '37 · Plans & pricing', S37_Plans],
    ['s38', '38 · Add-ons', S38_AddOns],
    ['s39', '39 · Checkout', S39_Checkout],
    ['s40', '40 · Payment success', S40_PaySuccess],
    ['s41', '41 · Payment failure', S41_PayFail],
    ['s42', '42 · My subscription', S42_MySubscription],
  ];
  const account = [
    ['s43', '43 · My profile', S43_MyProfile],
    ['s44', '44 · Edit section', S44_EditSection],
    ['s45', '45 · Photo manager', S45_PhotoManager],
    ['s46', '46 · Privacy settings', S46_Privacy],
    ['s47', '47 · Verification center', S47_Verify],
    ['s48', '48 · Document upload', S48_DocUpload],
    ['s49', '49 · Notifications', S49_Notifications],
    ['s50', '50 · Settings', S50_Settings],
    ['s51', '51 · Help & support', S51_Help],
    ['s52', '52 · Delete account', S52_Delete],
  ];
  const admin = [
    ['a24', 'A1 · Admin login', A24_Login, 1200, 780],
    ['a01', 'A2 · Dashboard', A01_Dashboard, 1200, 780],
    ['a02', 'A3 · All users', A02_Users, 1200, 780],
    ['a03', 'A4 · User detail', A03_UserDetail, 1200, 780],
    ['a04', 'A5 · Verification queue', A04_VerifyQueue, 1200, 780],
    ['a05', 'A6 · Document review', A05_VerifyDoc, 1200, 780],
    ['a06', 'A7 · Reports & flags', A06_Reports, 1200, 780],
    ['a07', 'A8 · Report detail', A07_ReportDetail, 1200, 780],
    ['a08', 'A9 · Blocked users', A08_Blocked, 1200, 780],
    ['a09', 'A10 · Featured personalities', A09_Featured, 1200, 780],
    ['a10', 'A11 · Featured editor', A10_FeaturedEdit, 1200, 780],
    ['a11', 'A12 · Content & banners', A11_Content, 1200, 780],
    ['a12', 'A13 · Payments', A12_Payments, 1200, 780],
    ['a13', 'A14 · Refunds queue', A13_Refunds, 1200, 780],
    ['a14', 'A15 · Coupons', A14_Coupons, 1200, 780],
    ['a15', 'A16 · Plans config', A15_Plans, 1200, 780],
    ['a16', 'A17 · Add-ons config', A16_AddOns, 1200, 780],
    ['a17', 'A18 · Match analytics', A17_Analytics, 1200, 780],
    ['a18', 'A19 · Funnel & cohorts', A18_Funnel, 1200, 780],
    ['a19', 'A20 · RM console', A19_RM, 1200, 780],
    ['a20', 'A21 · Bulk operations', A20_Bulk, 1200, 780],
    ['a21', 'A22 · Team & roles', A21_Team, 1200, 780],
    ['a22', 'A23 · Audit log', A22_Audit, 1200, 780],
    ['a23', 'A24 · App settings', A23_Settings, 1200, 780],
  ];

  const section = (id, title, subtitle, items) => (
    <DCSection id={id} title={title} subtitle={subtitle}>
      {items.map(([sid, label, Comp, w, h]) => (
        <DCArtboard key={sid} id={sid} label={label} width={w || 380} height={h || 744}>
          <Comp theme={theme}/>
        </DCArtboard>
      ))}
    </DCSection>
  );

  return (
    <>
      <DesignCanvas>
        <DCSection id="hero" title="Interactive prototype" subtitle="Tappable hero flow · Home → Profile → Interest → Chat. Use the Tweaks button (bottom-right) to switch palettes — every screen on the canvas updates.">
          <DCArtboard id="hero-proto" label="Hero prototype · live & tappable" width={380} height={744}>
            <HeroPrototype theme={theme}/>
          </DCArtboard>
        </DCSection>

        {section('preauth', 'A · Pre-auth (4 screens)', 'Splash → language → phone → OTP', preauth)}
        {section('onboarding', 'B · Profile creation (16 screens)', '14-step bilingual onboarding · progress bar throughout', onboarding)}
        {section('discovery', 'C · Home & discovery (9 screens)', 'Today\'s matches · Featured Personalities · search · profile detail', discovery)}
        {section('interactions', 'D · Interactions (7 screens)', 'Send/receive interest · shortlist · chat', interactions)}
        {section('subscription', 'E · Subscription & payments (6 screens)', 'Plans · checkout · success/fail · my subscription', subscription)}
        {section('account', 'F · Account & profile management (10 screens)', 'My profile · edit · privacy · verification · settings · help', account)}
        {section('admin', 'G · Admin · web app (24 screens)', 'Desktop · sidebar shell · verification, editorial, commerce, ops', admin)}

        <DCPostIt top={140} left={680} rotate={-3} width={200}>
          <strong>Hero prototype tip</strong><br/>
          Click any match card to open the profile, then tap "Send interest" to see the bottom sheet → success → chat.
        </DCPostIt>
        <DCPostIt top={300} left={680} rotate={2} width={200}>
          <strong>Tweaks panel</strong><br/>
          The bottom-right Tweaks button (bring it up via the toolbar) lets you swap palettes: saffron, maroon, jade or midnight.
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel title="Palette">
        <TweakSection label="Brand palette"/>
        <TweakRadio
          label="Color"
          value={t.palette}
          options={['saffron', 'maroon', 'jade', 'midnight']}
          onChange={(v) => setTweak('palette', v)}
        />
        <div style={{ display: 'flex', gap: 6, padding: '4px 0' }}>
          {['saffron', 'maroon', 'jade', 'midnight'].map(p => {
            const pal = KC_PALETTES[p];
            return (
              <div key={p} onClick={() => setTweak('palette', p)} style={{
                flex: 1, padding: 8, borderRadius: 8, cursor: 'pointer',
                background: pal.surface,
                border: `1.5px solid ${t.palette === p ? pal.primary : pal.border}`,
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
              }}>
                <div style={{ display: 'flex', gap: 2 }}>
                  <div style={{ width: 16, height: 16, borderRadius: 4, background: pal.primary }}/>
                  <div style={{ width: 16, height: 16, borderRadius: 4, background: pal.primaryDeep }}/>
                  <div style={{ width: 16, height: 16, borderRadius: 4, background: pal.surfaceWarm, border: `1px solid ${pal.border}` }}/>
                </div>
                <div style={{ fontSize: 9.5, color: pal.text, fontFamily: 'Inter, sans-serif', textTransform: 'capitalize' }}>{p}</div>
              </div>
            );
          })}
        </div>

        <TweakSection label="Notes"/>
        <div style={{ fontSize: 10.5, lineHeight: 1.45, color: 'rgba(41,38,27,0.7)', padding: '4px 2px' }}>
          76 screens — 52 mobile + 24 admin. Bilingual Hindi-first throughout. Two type weights only (400, 500). Saffron and maroon both safe for matrimony tone; jade and midnight are calmer alternatives.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
